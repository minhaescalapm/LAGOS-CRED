<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpando Cache - Lagos Credit</title>
  <style>
    body {
      background-color: #0d0d0f;
      color: #f4f4f5;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-weight: 900;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px 0;
      color: #fafafa;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .status {
      font-family: monospace;
      font-size: 12px;
      color: #f59e0b;
      background: #27272a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .btn {
      background: #f59e0b;
      color: #000;
      font-weight: 800;
      font-size: 14px;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">LC</div>
    <h1>Limpando Caches e Registros</h1>
    <p>Removendo qualquer aplicativo antigo (ex: "Minhas Contas") e restaurando a versão atualizada do Lagos Credit...</p>
    <div id="status" class="status">Iniciando limpeza profunda...</div>
    <a id="action-btn" href="/" class="btn" style="display:none;">Abrir Lagos Credit</a>
  </div>

  <script>
    async function deepClean() {
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('action-btn');
      
      try {
        // 1. Unregister all service workers
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
          }
          statusEl.innerText = 'Service Workers desregistrados (' + regs.length + ')';
        }

        // 2. Clear Cache Storage
        if ('caches' in window) {
          const names = await caches.keys();
          for (const name of names) {
            await caches.delete(name);
          }
          statusEl.innerText += ' | ' + names.length + ' caches deletados';
        }

        // 3. Clean legacy foreign localStorage keys
        let removed = 0;
        for (let i = localStorage.length - 1; i >= 0; i--) {
          const key = localStorage.key(i);
          if (key && !key.startsWith('gestao_emprestimos_') && !key.startsWith('supabase.') && !key.startsWith('wiped_')) {
            if (/conta|bill|despesa|expense|minha/i.test(key)) {
              localStorage.removeItem(key);
              removed++;
            }
          }
        }

        statusEl.innerText = 'Tudo limpo com sucesso! Redirecionando...';
        setTimeout(() => {
          window.location.replace('/');
        }, 1200);

      } catch (err) {
        statusEl.innerText = 'Concluído com avisos. Clique abaixo para entrar.';
        btn.style.display = 'block';
      }
    }

    deepClean();
  </script>
</body>
</html>
